<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>भूमेश्वर सिंह | ग्राम पंचायत बोई (हाडाबोई)</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #FF6B00;
    --deep-saffron: #E85D00;
    --green: #138808;
    --deep-green: #0D6406;
    --navy: #1A1A2E;
    --gold: #FFD700;
    --cream: #FFF8F0;
    --white: #FFFFFF;
    --text-dark: #1A1A2E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* ===== HERO ===== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #FF6B00 0%, #E85D00 30%, #1A1A2E 60%, #138808 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    z-index: 0;
  }

  .ashoka-wheel {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    animation: spin 60s linear infinite;
    z-index: 0;
  }
  .ashoka-wheel::before {
    content: '';
    position: absolute;
    inset: 30px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
  }

  @keyframes spin { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
    width: 100%;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 24px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 30px;
    animation: fadeInDown 0.8s ease;
  }

  .hero-layout {
    display: flex;
    align-items: center;
    gap: 50px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .candidate-photo-wrap {
    position: relative;
    flex-shrink: 0;
    animation: fadeInLeft 1s ease;
  }

  .photo-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    animation: pulse-ring 2s ease-in-out infinite;
  }
  .photo-ring-2 {
    position: absolute;
    inset: -24px;
    border-radius: 50%;
    border: 1px solid rgba(255,215,0,0.4);
    animation: pulse-ring 2s ease-in-out infinite 0.5s;
  }

  @keyframes pulse-ring {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.6; transform:scale(1.03); }
  }

  .candidate-photo {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    border: 4px solid white;
    position: relative;
    z-index: 1;
    display: block;
  }

  .sash {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, var(--saffron), var(--gold));
    color: var(--navy);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 4px 16px;
    border-radius: 20px;
    white-space: nowrap;
    z-index: 2;
    letter-spacing: 1px;
  }

  .hero-text { animation: fadeInRight 1s ease; }

  .vote-tag {
    font-size: 0.7rem;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .hero-name {
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 900;
    color: white;
    line-height: 1.1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .hero-name span { color: var(--gold); }

  .hero-post {
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    color: rgba(255,255,255,0.85);
    margin: 12px 0;
    font-weight: 400;
  }

  .hero-panchayat {
    display: inline-block;
    background: rgba(255,215,0,0.2);
    border: 1px solid rgba(255,215,0,0.5);
    color: var(--gold);
    padding: 6px 20px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .hero-tagline {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    color: rgba(255,255,255,0.9);
    font-style: italic;
    line-height: 1.7;
    background: rgba(0,0,0,0.2);
    padding: 16px 24px;
    border-left: 4px solid var(--gold);
    border-radius: 0 8px 8px 0;
    text-align: left;
    max-width: 480px;
  }

  .hero-cta {
    margin-top: 28px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold), #FFA500);
    color: var(--navy);
    padding: 14px 32px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(255,165,0,0.4);
    cursor: pointer;
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,165,0,0.5); }

  .btn-secondary {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    color: white;
    padding: 14px 32px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.3);
    transition: all 0.3s;
    cursor: pointer;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.25); transform: translateY(-3px); }

  .scroll-indicator {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    animation: bounce 2s ease-in-out infinite;
    color: rgba(255,255,255,0.6);
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-align: center;
  }
  .scroll-arrow { font-size: 1.5rem; display: block; color: var(--gold); }
  @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(8px)} }

  /* ===== FLAG STRIPE ===== */
  .tricolor-stripe {
    height: 8px;
    background: linear-gradient(90deg, #FF6B00 0%, #FF6B00 33%, white 33%, white 66%, #138808 66%, #138808 100%);
  }

  /* ===== STATS BANNER ===== */
  .stats-banner {
    background: var(--navy);
    padding: 24px 20px;
  }
  .stats-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
  }
  .stat-item {
    text-align: center;
    color: white;
    animation: fadeIn 1s ease;
  }
  .stat-num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
    display: block;
  }
  .stat-label {
    font-size: 0.75rem;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  /* ===== SECTIONS ===== */
  section { padding: 70px 20px; }

  .section-header {
    text-align: center;
    margin-bottom: 50px;
  }
  .section-tag {
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--saffron);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .section-title {
    font-size: clamp(1.8rem, 3.5vw, 2.5rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.2;
  }
  .section-title span { color: var(--saffron); }
  .title-underline {
    width: 60px;
    height: 4px;
    background: linear-gradient(90deg, var(--saffron), var(--gold));
    margin: 16px auto 0;
    border-radius: 2px;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  /* ===== ABOUT ===== */
  .about-section { background: white; }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
    align-items: center;
  }
  .about-img-wrap { position: relative; }
  .about-img-frame {
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 20px 20px 60px rgba(0,0,0,0.15);
  }
  .about-img-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  .about-accent {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 3px solid var(--saffron);
    border-radius: 20px;
    top: 15px;
    left: 15px;
    z-index: -1;
  }
  .about-badge {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: linear-gradient(135deg, var(--saffron), var(--gold));
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 800;
    text-align: center;
    font-size: 0.7rem;
    line-height: 1.3;
    box-shadow: 0 8px 24px rgba(255,107,0,0.4);
    border: 3px solid white;
  }

  .about-content h2 {
    font-size: clamp(1.5rem, 2.5vw, 2rem);
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .about-content h2 span { color: var(--saffron); }
  .about-content p {
    color: #555;
    line-height: 1.8;
    margin-bottom: 16px;
    font-size: 0.95rem;
  }

  .values-list {
    list-style: none;
    margin-top: 20px;
  }
  .values-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.9rem;
    color: #444;
    font-weight: 500;
  }
  .values-list li::before {
    content: '✓';
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green), #1CA810);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ===== PROMISES ===== */
  .promises-section { background: var(--cream); }

  .promises-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }

  .promise-card {
    background: white;
    border-radius: 20px;
    padding: 30px;
    transition: all 0.3s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  .promise-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--saffron), var(--gold));
    transform: scaleX(0);
    transition: transform 0.3s ease;
    transform-origin: left;
  }
  .promise-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    border-color: rgba(255,107,0,0.2);
  }
  .promise-card:hover::before { transform: scaleX(1); }

  .promise-icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
    display: block;
  }
  .promise-num {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 3.5rem;
    font-weight: 900;
    color: rgba(255,107,0,0.06);
    line-height: 1;
  }
  .promise-card h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-family: 'Tiro Devanagari Hindi', serif;
  }
  .promise-points {
    list-style: none;
  }
  .promise-points li {
    font-size: 0.82rem;
    color: #666;
    padding: 5px 0;
    padding-left: 16px;
    position: relative;
    line-height: 1.5;
    font-family: 'Tiro Devanagari Hindi', serif;
  }
  .promise-points li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--saffron);
    font-size: 0.75rem;
  }

  /* ===== SPECIAL PROMISES ===== */
  .special-section {
    background: linear-gradient(135deg, var(--navy) 0%, #16213e 50%, #0f3460 100%);
    padding: 70px 20px;
    position: relative;
    overflow: hidden;
  }
  .special-section::before {
    content: '★';
    position: absolute;
    font-size: 400px;
    opacity: 0.02;
    top: -100px;
    right: -100px;
    color: white;
  }
  .special-section .section-title { color: white; }
  .special-section .section-tag { color: var(--gold); }

  .special-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 40px;
  }
  .special-item {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
    text-align: center;
  }
  .special-item:hover {
    background: rgba(255,215,0,0.1);
    border-color: rgba(255,215,0,0.5);
    transform: translateY(-5px);
  }
  .special-item .icon { font-size: 2rem; margin-bottom: 12px; display: block; }
  .special-item p {
    color: rgba(255,255,255,0.85);
    font-size: 0.85rem;
    font-family: 'Tiro Devanagari Hindi', serif;
    line-height: 1.6;
  }
  .special-item .highlight {
    color: var(--gold);
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 8px;
    display: block;
    font-family: 'Tiro Devanagari Hindi', serif;
  }

  /* ===== QUOTE ===== */
  .quote-section {
    background: linear-gradient(135deg, var(--saffron) 0%, var(--deep-saffron) 100%);
    padding: 60px 20px;
    text-align: center;
  }
  .quote-text {
    font-family: 'Tiro Devanagari Hindi', serif;
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: white;
    font-style: italic;
    line-height: 1.7;
    max-width: 700px;
    margin: 0 auto 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .quote-quote { font-size: 4rem; color: rgba(255,255,255,0.3); display: block; margin-bottom: -20px; line-height: 1; }
  .quote-author {
    color: rgba(255,255,255,0.8);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ===== FOOTER ===== */
  footer {
    background: var(--navy);
    color: white;
    padding: 50px 20px 30px;
    text-align: center;
  }
  .footer-logo {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 8px;
    font-family: 'Tiro Devanagari Hindi', serif;
  }
  .footer-sub {
    color: rgba(255,255,255,0.5);
    font-size: 0.8rem;
    margin-bottom: 30px;
  }
  .footer-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .footer-links a {
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.3s;
    cursor: pointer;
  }
  .footer-links a:hover { color: var(--gold); }

  .footer-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0; }
  .footer-copy { color: rgba(255,255,255,0.3); font-size: 0.75rem; }

  .vote-appeal {
    display: inline-block;
    background: linear-gradient(135deg, var(--saffron), var(--gold));
    color: var(--navy);
    padding: 16px 40px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 1rem;
    margin: 20px 0;
    font-family: 'Tiro Devanagari Hindi', serif;
    animation: pulse-btn 2s ease-in-out infinite;
    box-shadow: 0 8px 30px rgba(255,107,0,0.4);
  }
  @keyframes pulse-btn {
    0%,100% { box-shadow: 0 8px 30px rgba(255,107,0,0.4); }
    50% { box-shadow: 0 8px 50px rgba(255,107,0,0.7); }
  }

  /* ===== NAV ===== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 12px 20px;
    background: rgba(26,26,46,0.95);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,215,0,0.2);
    transform: translateY(-100%);
    transition: transform 0.3s ease;
  }
  .nav.visible { transform: translateY(0); }
  .nav-brand {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--gold);
    font-family: 'Tiro Devanagari Hindi', serif;
  }
  .nav-links { display: flex; gap: 24px; }
  .nav-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    transition: color 0.3s;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .nav-links a:hover { color: var(--gold); }

  @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeInLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
  @keyframes fadeInRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ===== RESPONSIVE ===== */
  @media(max-width: 700px) {
    .about-grid { grid-template-columns: 1fr; }
    .about-img-wrap { max-width: 300px; margin: 0 auto; }
    .hero-layout { flex-direction: column; gap: 30px; }
    .nav-links { display: none; }
    .hero-tagline { max-width: 100%; }
    .hero-cta { justify-content: center; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="navbar">
  <div class="nav-brand">भूमेश्वर सिंह</div>
  <div class="nav-links">
    <a onclick="scrollToSection('about')">परिचय</a>
    <a onclick="scrollToSection('promises')">संकल्प</a>
    <a onclick="scrollToSection('special')">विशेष वादे</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="ashoka-wheel"></div>

  <div class="hero-content">
    <div class="hero-badge">🗳️ &nbsp; ग्राम पंचायत चुनाव 2026 &nbsp; 🗳️</div>

    <div class="hero-layout">
      <div class="candidate-photo-wrap">
        <div class="photo-ring"></div>
        <div class="photo-ring-2"></div>
        <img 
          class="candidate-photo"
